name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types (strict)
        run: |
          python -m mypy
          python -m mypy tests --ignore-missing-imports
      - name: Tests
        run: python -m pytest --cov=gsps --cov-report=term-missing --cov-fail-under=90
      - name: Example walk (must be consistent; ship gate must block)
        run: |
          gsps validate-walk --claims examples/onepager_walk/claims.csv --track1 examples/onepager_walk/track1.csv
          ! gsps ship-check --claims examples/onepager_walk/claims.csv --track1 examples/onepager_walk/track1.csv --track2 examples/onepager_walk/track2.csv --page examples/onepager_walk/page.md
      - name: Live walk (real revision ripples through the engine)
        run: bash examples/live_walk/run.sh
